[project]
name = "fpl-analyst"
version = "0.1.0"
description = "Weekly Fantasy Premier League points projection, squad optimisation and grounded explanation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "requests>=2.31",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "pulp>=2.8",
    "rapidfuzz>=3.6",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "responses>=0.25"]
llm = ["anthropic>=0.40"]

[project.scripts]
fpl = "fpl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PD"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["network: hits a live external API (skipped by default)"]
