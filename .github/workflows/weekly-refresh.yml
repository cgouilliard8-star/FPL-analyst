name: refresh

# Injury news, price changes and availability flags move every day, so the
# projections are rebuilt every morning and again just before the usual Saturday
# deadline. Each run snapshots the live API (immutable, timestamped), refits the
# model on everything up to the next gameweek, and publishes the dashboard.
on:
  schedule:
    - cron: "0 6 * * *"    # daily 06:00 UTC
    - cron: "0 10 * * 6"   # Saturday 10:00 UTC, ahead of the typical 11:30 deadline
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,llm]"

      - name: Historical seasons
        run: |
          fpl bootstrap
          fpl silver

      - name: Live snapshot
        run: fpl snapshot

      - name: Season replay (from GW1, one free transfer a week, real points)
        run: fpl simulate --from-gw 1 --to-gw 3

      - name: Project the next five gameweeks and build dashboard data
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: fpl live

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
