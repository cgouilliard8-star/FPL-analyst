name: refresh

# Injury news, price changes and availability flags move every day, and most of
# all in the last day before a deadline. The workflow wakes every six hours; a
# cheap first step (`fpl due`) lets it go on only within 36 hours of the next
# deadline, or once a day as a heartbeat, or when run by hand. A run that goes on
# snapshots the live API (immutable, timestamped), refits the model on everything
# up to the next gameweek, and publishes the dashboard.
#
# Failure policy: the site must never go blank or show broken numbers. Every step
# that can fail falls back to the last good artefact -- the previous snapshot, the
# previously published live.json -- and the deploy is gated on `fpl check`.
on:
  schedule:
    - cron: "0 */6 * * *"   # every six hours; `fpl due` decides whether to build
  workflow_dispatch:

permissions:
  contents: write   # commits the refreshed live.json back so the last good copy advances
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,llm]"

      - name: Is a refresh due? (near a deadline, a day since the last, or by hand)
        id: due
        run: fpl due ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: Tests (a refresh from broken code is not a refresh)
        if: steps.due.outputs.due == 'true'
        run: pytest -q -p no:warnings

      # The historical archive only changes when a season is added; cache it so a
      # flaky archive host cannot stop a refresh.
      - name: Historical seasons (cached)
        id: archive
        if: steps.due.outputs.due == 'true'
        uses: actions/cache@v4
        with:
          path: |
            data/bronze/archive_*.parquet
            data/bronze/players_*.parquet
            data/silver
          key: archive-${{ hashFiles('src/fpl/config.py', 'src/fpl/data/archive.py', 'src/fpl/data/silver.py', 'src/fpl/entity/**') }}
      - name: Build historical seasons
        if: steps.due.outputs.due == 'true' && steps.archive.outputs.cache-hit != 'true'
        run: |
          fpl bootstrap
          fpl silver

      - name: Live snapshot (retries inside)
        id: snapshot
        if: steps.due.outputs.due == 'true'
        run: fpl snapshot

      - name: Cup and European fixtures (congestion; non-fatal)
        if: steps.due.outputs.due == 'true'
        continue-on-error: true
        run: fpl schedule --all

      - name: Bookmaker odds (football-data.co.uk + The Odds API; non-fatal)
        if: steps.due.outputs.due == 'true'
        continue-on-error: true
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: fpl -v odds --all

      - name: Season replay (from GW1, one free transfer a week, real points)
        if: steps.due.outputs.due == 'true'
        continue-on-error: true   # slow and cosmetic: the page keeps the last one if it fails
        run: fpl simulate --from-gw 1 --to-gw 3

      - name: Project the next five gameweeks and build dashboard data
        id: live
        if: steps.due.outputs.due == 'true'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: fpl live

      - name: Validate, or restore the last published data
        id: gate
        if: steps.due.outputs.due == 'true'
        run: |
          if [ "${{ steps.live.outcome }}" = "success" ] && fpl check; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::live build failed validation; publishing the previous live.json"
            git checkout -- site/data/live.json
            fpl check || echo "::error::previous live.json also fails validation"
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit refreshed data (keeps the last good copy in git)
        if: steps.due.outputs.due == 'true' && steps.gate.outputs.fresh == 'true'
        run: |
          git config user.name "refresh-bot"
          git config user.email "refresh-bot@users.noreply.github.com"
          git add site/data/live.json data/external
          git diff --cached --quiet || git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
          git push

      - uses: actions/upload-pages-artifact@v3
        if: steps.due.outputs.due == 'true'
        with:
          path: site
    outputs:
      due: ${{ steps.due.outputs.due }}

  deploy:
    needs: build
    if: needs.build.outputs.due == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
